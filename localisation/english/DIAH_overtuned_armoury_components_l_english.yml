##############
# Astral FTL #
##############
 DIAH_overtuned_astral_hyperdrive: "Astral Hyperdrive"
 DIAH_overtuned_astral_hyperdrive_desc: "Ships equipped with Hyper Drives travel swiftly between the edges of star systems along interstellar hyperlanes. Astral Hyperdrives make use of astral threads to create an ultra-stable hyperfield, allowing for quicker transit."
 DIAH_overtuned_astral_hyperdrive_civ: "$DIAH_overtuned_astral_hyperdrive$"
 DIAH_overtuned_astral_hyperdrive_civ_desc: "$DIAH_overtuned_astral_hyperdrive_desc$"
 DIAH_overtuned_astral_jump: "Astral Wormhole Drive"
 DIAH_overtuned_astral_jump_desc: "The Astral Wormhole Drive operates similarly to the Jump Drive, creating a short-lived wormhole between a ship and its destination, thus allowing for near-instantaneous transit. For crew safety, it is recommended not to look outside the windows during transit."
 DIAH_overtuned_astral_psi_jumpdrive: "Psycho-Astral Wormhole Drive"
 DIAH_overtuned_astral_psi_jumpdrive_desc: "The Psycho-Astral Wormhole Drive is the ultimate in FTL technology, allowing wormhole generation at incredible range through the power of combining astral and psychic technologies. The Futuristics Division takes no responsibility for any extradimensional beings summoned by use of this engine."